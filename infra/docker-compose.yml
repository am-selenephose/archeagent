services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archeagent
      POSTGRES_PASSWORD: archeagent
      POSTGRES_DB: archeagent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archeagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - archeagent-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - archeagent-redis:/data

volumes:
  archeagent-postgres:
  archeagent-redis:
