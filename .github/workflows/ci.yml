name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ARCHEAGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      ARCHEAGENT_TEST_DATABASE_URL: postgres://archeagent:archeagent@127.0.0.1:5432/archeagent
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archeagent
          POSTGRES_PASSWORD: archeagent
          POSTGRES_DB: archeagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archeagent -d archeagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
